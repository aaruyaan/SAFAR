<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SAFAR — AI Local Discovery & Travel Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23C4694F'/%3E%3Cpath d='M15 9l-2 6-6 2 2-6 6-2z' fill='%23FBF7F0'/%3E%3C/svg%3E" />
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
  body { background: #FBFBFA; }
  #safar-boot-error {
    display: none; max-width: 640px; margin: 60px auto; padding: 24px 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff; border: 1px solid #E1D9C7; border-radius: 14px; color: #1C2321;
  }
  #safar-boot-error h2 { margin-top: 0; font-size: 18px; }
  #safar-boot-error pre { white-space: pre-wrap; word-break: break-word; background: #F6EFE2; padding: 14px; border-radius: 8px; font-size: 12.5px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="safar-boot-error">
  <h2>SAFAR couldn't start</h2>
  <p>There was an error running the app. Details below:</p>
  <pre id="safar-boot-error-msg"></pre>
</div>

<!-- Leaflet (map rendering) — loaded from CDN because map tiles are images that must be fetched
     from a live tile server over the network; there is no way to bundle live map imagery offline.
     If this fails to load (e.g. no internet access), SAFAR falls back to a clear "map unavailable"
     state rather than faking a map. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""
  onerror="window.__SAFAR_LEAFLET_CSS_FAILED = true;" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""
  onerror="window.__SAFAR_LEAFLET_FAILED = true;"></script>

<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("safar-boot-error");
  var msg = document.getElementById("safar-boot-error-msg");
  if (box && msg && box.style.display === "none") {
    box.style.display = "block";
    msg.textContent = (e.error && e.error.stack) || e.message || String(e);
  }
});
</script>
